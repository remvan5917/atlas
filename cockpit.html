<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<title>Cockpit Atlas</title>
<style>
  :root { --bg: #06070a; --carte: rgba(18,19,24,.92); --carte2: rgba(26,27,34,.92); --ambre: #ffb547; --ambre2: #ffcf8a; --texte: #f4ece0; --doux: rgba(255, 217, 160, .58);
    --ligne: rgba(255, 181, 71, .2); --ok: #7ee2b8; --alerte: #ff7a45; --froid: #9cc8ff; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--texte); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { padding: 12px 14px; background: radial-gradient(60% 40% at 50% 0%, rgba(255, 181, 71, .08), transparent 70%), radial-gradient(40% 50% at 100% 100%, rgba(156, 200, 255, .05), transparent 70%), var(--bg); min-height: 100vh; }
  body.nuit::after { content: ''; position: fixed; inset: 0; background: rgba(0, 0, 0, .45); pointer-events: none; z-index: 8; }
  .mono { font-family: ui-monospace, 'DejaVu Sans Mono', 'Roboto Mono', monospace; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .titre { letter-spacing: .35em; font-size: 12px; color: var(--ambre2); }
  .horloge { display: flex; align-items: baseline; gap: 14px; }
  .heure { font-size: clamp(34px, 4.2vw, 52px); font-weight: 250; letter-spacing: .03em; line-height: 1; }
  .date { font-size: 14px; color: var(--doux); text-transform: capitalize; }
  .etat { display: flex; gap: 8px; flex-wrap: wrap; }
  .pastille { border: 1px solid var(--ligne); border-radius: 999px; padding: 7px 13px; font-size: 13px; color: var(--doux); background: rgba(255, 181, 71, .05); white-space: nowrap; }
  .pastille b { color: var(--texte); font-weight: 600; }
  .pastille.ok b { color: var(--ok); } .pastille.al { border-color: rgba(255, 122, 69, .6); } .pastille.al b { color: var(--alerte); }
  main { display: grid; gap: 12px; grid-template-columns: minmax(250px, 285px) minmax(0, 1fr) minmax(280px, 335px); height: calc(100vh - 90px); }
  .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .carte { background: linear-gradient(180deg, var(--carte2), var(--carte)); border: 1px solid var(--ligne); border-radius: 18px; padding: 12px 14px 14px; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .carte.grand { flex: 1; }
  .carte h2 { margin: 0 0 10px; font: 600 11px ui-monospace, monospace; letter-spacing: .3em; color: var(--ambre); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex: 0 0 auto; }
  .carte h2 span { color: var(--doux); letter-spacing: .08em; font-weight: 400; }
  .defile { overflow-y: auto; min-height: 0; scrollbar-width: none; } .defile::-webkit-scrollbar { display: none; }
  .scenes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .scene { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 62px; padding: 8px 4px; border-radius: 14px; border: 1px solid var(--ligne); background: rgba(255, 181, 71, .06); color: var(--texte); font: 600 12px system-ui; text-align: center; line-height: 1.15; cursor: pointer; transition: transform .1s, background .2s; }
  .scene i { font-style: normal; font-size: 22px; line-height: 1; }
  .scene:active { transform: scale(.97); background: rgba(255, 181, 71, .2); }
  .scene.danger { border-color: rgba(255, 122, 69, .7); background: rgba(255, 122, 69, .12); color: #ffd2c2; }
  .scene.fait { background: rgba(126, 226, 184, .18); border-color: rgba(126, 226, 184, .6); }
  .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .carte.lum { flex: 0 1 auto; max-height: 44%; }
  .tuile { border: 1px solid var(--ligne); border-radius: 14px; padding: 9px 11px; background: rgba(255, 255, 255, .02); cursor: pointer; user-select: none; min-height: 58px; display: flex; flex-direction: column; justify-content: space-between; transition: background .25s, border-color .25s, box-shadow .25s; }
  .tuile .nom { font-size: 14px; line-height: 1.2; }
  .tuile .val { font: 12px ui-monospace, monospace; color: var(--doux); }
  .tuile.on { background: rgba(255, 181, 71, .17); border-color: rgba(255, 181, 71, .7); box-shadow: 0 0 22px rgba(255, 181, 71, .2) inset; }
  .tuile.on .val { color: var(--ambre2); }
  .tuile.hs { opacity: .4; }
  .tuile input[type=range] { width: 100%; accent-color: var(--ambre); margin: 8px 0 0; height: 22px; }
  .ligne { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(255, 181, 71, .08); font-size: 14px; }
  .ligne:last-child { border-bottom: 0; }
  .ligne .k { color: var(--doux); } .ligne .v { text-align: right; } .v.ok { color: var(--ok); } .v.al { color: var(--alerte); }
  .rdv { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid rgba(255, 181, 71, .08); font-size: 14px; }
  .rdv:last-child { border-bottom: 0; } .rdv .h { font: 600 14px ui-monospace, monospace; color: var(--ambre2); flex: 0 0 50px; } .rdv.passe { opacity: .4; }
  .rdv .jour { font-size: 11px; color: var(--doux); letter-spacing: .15em; }
  .cams { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; flex: 0 0 auto; }
  .cam { position: relative; border: 1px solid var(--ligne); border-radius: 12px; overflow: hidden; background: #020304; aspect-ratio: 16 / 10; cursor: pointer; }
  .cam img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam .lab { position: absolute; left: 7px; top: 6px; font: 10px ui-monospace, monospace; letter-spacing: .14em; text-shadow: 0 0 4px #000; }
  .cam .info { position: absolute; right: 7px; bottom: 6px; font: 10px ui-monospace, monospace; color: var(--doux); text-shadow: 0 0 4px #000; }
  .cam .vide { position: absolute; inset: 0; display: grid; place-items: center; font: 11px ui-monospace, monospace; color: var(--doux); text-align: center; padding: 6px; }
  .cam.mouv { border-color: var(--ambre2); box-shadow: 0 0 14px rgba(255, 207, 138, .35); }
  .alerte { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255, 181, 71, .08); font-size: 13px; align-items: flex-start; }
  .alerte:last-child { border-bottom: 0; }
  .alerte .h { font: 12px ui-monospace, monospace; color: var(--doux); flex: 0 0 42px; padding-top: 1px; }
  .alerte.urgent .t { color: var(--alerte); }
  .alerte img { width: 60px; height: 38px; object-fit: cover; border-radius: 6px; flex: 0 0 auto; }
  .marche { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .prix { border: 1px solid var(--ligne); border-radius: 12px; padding: 8px 10px; }
  .prix .s { font: 11px ui-monospace, monospace; color: var(--doux); letter-spacing: .1em; }
  .prix .p { font-size: 18px; margin-top: 2px; } .haut { color: var(--ok); } .bas { color: var(--alerte); }
  #plan { flex: 1; min-height: 0; display: flex; } #plan svg { width: 100%; height: 100%; display: block; }
  #plan .piece { cursor: pointer; transition: fill .4s, stroke .4s; }
  #plan text { font-family: ui-monospace, monospace; pointer-events: none; }
  @keyframes pulse { 0% { r: 8; opacity: .9; } 100% { r: 28; opacity: 0; } }
  #plan .onde { animation: pulse 1.6s ease-out infinite; }
  .reserve { height: 150px; flex: 0 0 auto; } /* le coin d'Atlas (son visage, en bas à droite) */
  .config { max-width: 520px; margin: 40px auto; }
  .config input { width: 100%; font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--ligne); background: var(--carte); color: var(--texte); margin: 8px 0; }
  .config button { font: inherit; color: var(--texte); background: rgba(255, 181, 71, .1); border: 1px solid var(--ligne); border-radius: 10px; padding: 10px 14px; }
  .muted { color: var(--doux); font-size: 12px; }
  .toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 9; padding: 10px 16px; border-radius: 999px; background: rgba(18, 19, 24, .95); border: 1px solid var(--ambre); color: var(--ambre2); font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  /* en portrait, ou sur un téléphone : une seule colonne qui défile */
  @media (max-width: 980px), (orientation: portrait) {
    main { grid-template-columns: 1fr; height: auto; }
    .carte.grand { flex: 0 0 auto; } #plan { min-height: 300px; } .defile { max-height: none; overflow: visible; } .reserve { height: 140px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <div class="titre mono">◢ COCKPIT · ATLAS</div>
    <div class="horloge"><div class="heure mono" id="heure">--:--</div><div class="date" id="date"></div></div>
  </div>
  <div class="etat" id="etat"></div>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<div id="config" class="config" hidden>
  <div class="titre mono">◢ ADRESSE DE LA MAISON</div>
  <p class="muted">Ouvre d'abord Atlas sur cet appareil (le cockpit reprend son adresse), ou tape l'adresse de l'ordinateur de la maison :</p>
  <input id="adresse" placeholder="https://….ts.net" autocomplete="off">
  <button id="adresse-ok">Enregistrer</button>
</div>
<script>
'use strict';
/* Le cockpit de la maison : lumières, prises, caméras, alertes, marchés, Shadow, énergie, système — en temps réel.
   Il reprend l'adresse de la maison des réglages d'Atlas (même appareil) ; tout passe par l'ordinateur de la maison (Tailscale). */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const N = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
let S = {}; try { S = JSON.parse(localStorage.getItem('atlas-etat') || '{}'); } catch (e) { S = {}; }
const reglages = S.settings || {};
let ROOT = ''; try { ROOT = localStorage.getItem('cockpit-adresse') || ''; } catch (e) { /* rien */ }
if (!ROOT) ROOT = (reglages.localUrl || '').replace(/\/+$/, '').replace(/\/v1$/, '');
if (!/^https?:\/\//.test(ROOT) || /localhost:11434/.test(ROOT)) ROOT = '';
async function appel(chemin, corps, ms = 15000) {
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(ROOT + chemin, { method: corps ? 'POST' : 'GET', headers: corps ? { 'Content-Type': 'application/json' } : {}, body: corps ? JSON.stringify(corps) : undefined, cache: 'no-store', signal: ctl.signal });
    if (!r.ok) throw new Error(r.status);
    return /image/.test(r.headers.get('Content-Type') || '') ? r.blob() : r.json();
  } finally { clearTimeout(tm); }
}
const hh = d => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
const nf = (v, d = 2) => Number(v).toLocaleString('fr-FR', { maximumFractionDigits: d });

/* ---------- la mise en page ---------- */
// les scènes passent par Atlas (le cockpit vit dans Atlas) : comme si on les lui disait
const ATLAS = (() => { try { return window.parent !== window && typeof window.parent.handle === 'function' ? window.parent.handle : null; } catch (e) { return null; } })();
function dis(texte, bouton) {
  if (!ATLAS) return;
  try { ATLAS(texte); } catch (e) { /* rien */ }
  if (bouton) { bouton.classList.add('fait'); setTimeout(() => bouton.classList.remove('fait'), 1500); }
  const t = $('#toast'); t.textContent = `« ${texte} »`; t.style.opacity = '1'; clearTimeout(t._f); t._f = setTimeout(() => { t.style.opacity = '0'; }, 2200);
}
const SCENES = [['🌙', 'Bonne nuit', 'je vais me coucher'], ['☀️', 'Réveil', 'je viens de me réveiller'], ['🎬', 'Cinéma', 'mode cinéma'], ['🎉', 'Soirée', 'mode soirée'],
  ['🛡️', 'Scan sécurité', 'scan de sécurité'], ['🌃', 'Rapport de nuit', 'rapport de nuit'], ['🎮', 'Jeu télévisé', 'lance le jeu télévisé'], ['🤖', 'Duo Shadow', 'discute avec Shadow']];
function cartes() {
  $('#main').innerHTML = `
    <div class="col">
      <section class="carte"><h2>SCÈNES <span>${ATLAS ? 'un toucher' : ''}</span></h2><div class="scenes" id="scenes"></div></section>
      <section class="carte grand"><h2>AUJOURD'HUI <span id="ag-res"></span></h2><div class="defile" id="agenda"></div></section>
      <section class="carte"><h2>MARCHÉS</h2><div class="marche" id="marche"></div><div id="annonces" class="muted" style="margin-top:8px"></div></section>
    </div>
    <div class="col">
      <section class="carte grand"><h2>LA MAISON <span>toucher une pièce : allumer / éteindre</span></h2><div id="plan"></div></section>
      <section class="carte lum"><h2>LUMIÈRES & PRISES <span id="lum-res"></span></h2><div class="grille defile" id="lumieres"></div></section>
    </div>
    <div class="col">
      <section class="carte"><h2>CAMÉRAS <span>toucher : photo fraîche</span></h2><div class="cams" id="cams"></div></section>
      <section class="carte grand"><h2>ALERTES <span id="al-res"></span></h2><div class="defile" id="alertes"></div></section>
      <section class="carte" style="display:none"><h2>MAISON</h2><div id="maison"></div></section>
      <section class="carte" style="display:none"><h2>SYSTÈMES</h2><div id="systeme"></div></section>
      <div class="reserve"></div>
    </div>`;
  const sc = [['💡', 'Tout éteindre', null, toutEteindre], [absent ? '🏠' : '🚪', absent ? 'Je suis rentré' : 'Je pars', null, basculeAbsent]]
    .concat(ATLAS ? SCENES : []).concat([['⚠️', 'Danger', null, danger, 'danger']]);
  $('#scenes').innerHTML = sc.map(([i, t, , , cls], k) => `<button class="scene ${cls || ''}" data-k="${k}"><i>${i}</i>${esc(t)}</button>`).join('');
  document.querySelectorAll('.scene').forEach(b => b.onclick = () => { const x = sc[+b.dataset.k]; if (x[3]) x[3](b); else dis(x[2], b); });
}
const ligne = (k, v, cls = '') => `<div class="ligne"><span class="k">${esc(k)}</span><span class="v ${cls}">${esc(v)}</span></div>`;

/* ---------- le plan holographique : les pièces s'allument comme les vraies lampes, les caméras autour ---------- */
let alertesRecentes = [];
function plan() {
  const el = $('#plan'); if (!el) return;
  const lampes = appareils.filter(a => a.type === 'lampe');
  const etage = a => /\b(chambres?|salle de bains?|premier etage|etage|bureau|grenier)\b/.test(N(a.nom));
  const niveaux = [['ÉTAGE', lampes.filter(etage)], ['REZ-DE-CHAUSSÉE', lampes.filter(a => !etage(a))]];
  const W = 1000, M = 130, Hn = 150, gap = 26, top = 70;
  const boites = {};
  let svg = `<svg viewBox="0 0 ${W} ${top + niveaux.length * (Hn + gap) + 80}" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="lueur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <pattern id="grille" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="rgba(255,181,71,.06)"/></pattern></defs>
    <rect x="0" y="0" width="${W}" height="100%" fill="url(#grille)"/>
    <path d="M${M - 10} ${top - 6} L${W / 2} 12 L${W - M + 10} ${top - 6}" fill="none" stroke="rgba(255,181,71,.45)" stroke-width="2"/>`;
  niveaux.forEach(([nom, l], k) => {
    const y = top + k * (Hn + gap), n = Math.max(1, l.length), w = (W - 2 * M - (n - 1) * 10) / n;
    svg += `<text x="${M - 8}" y="${y - 6}" font-size="11" fill="rgba(255,217,160,.5)" letter-spacing="3">${nom}</text>`;
    l.forEach((a, i) => {
      const x = M + i * (w + 10), on = a.allume, lum = on ? (a.lum != null ? a.lum : 100) / 100 : 0, hs = a.allume == null;
      boites[N(a.nom)] = { x: x + w / 2, y };
      const chaud = a.teinte == null ? 30 : a.teinte; const col = `hsl(${38 - chaud * 0.18}, 100%, ${55 + chaud * 0.25}%)`;
      svg += `<g class="piece" data-id="${esc(a.id)}">
        ${on ? `<rect x="${x + 4}" y="${y + 4}" width="${w - 8}" height="${Hn - 8}" rx="9" fill="${col}" opacity="${0.1 + lum * 0.3}"/>` : ''}
        <rect x="${x}" y="${y}" width="${w}" height="${Hn}" rx="10" fill="${on ? `rgba(255,181,71,${0.06 + lum * 0.16})` : 'rgba(255,255,255,.02)'}" stroke="${hs ? 'rgba(255,122,69,.5)' : on ? col : 'rgba(255,181,71,.25)'}" stroke-width="${on ? 2 : 1}" ${hs ? 'stroke-dasharray="6 5"' : ''}/>
        <text x="${x + w / 2}" y="${y + Hn / 2 - 4}" text-anchor="middle" font-size="${w < 130 || a.nom.length > 18 ? 12 : 15}" fill="${on ? '#fff3dd' : 'rgba(244,236,224,.55)'}">${esc(a.nom)}</text>
        <text x="${x + w / 2}" y="${y + Hn / 2 + 16}" text-anchor="middle" font-size="11" fill="${hs ? '#ff7a45' : 'rgba(255,217,160,.6)'}">${hs ? 'SANS COURANT' : on ? `${a.lum != null ? a.lum + ' %' : 'allumée'}` : 'éteinte'}</text></g>`;
    });
  });
  // les caméras autour de la maison : la toiture en haut, la cour derrière, la façade devant (la rue), l'intérieur au centre
  const yBas = top + niveaux.length * (Hn + gap) + 30;
  // la toiture regarde le velux de la chambre de papa ; la cour et le plateau sont à l'arrière (la LSC filme le plateau derrière une fenêtre)
  const papa = Object.entries(boites).find(([k]) => /papa/.test(k));
  const place = c => /toit/.test(N(c.nom)) ? [papa ? papa[1].x : W / 2, 22] : /cour|jardin/.test(N(c.nom)) ? [W - 62, top + Hn / 2] : /plateau/.test(N(c.nom)) ? [W - 62, top + Hn + gap + Hn / 2] : /facade|rue|portail/.test(N(c.nom)) ? [W / 2, yBas] : [62, top + Hn + gap / 2];
  cams.forEach(c => {
    const [x, y] = place(c), recent = alertesRecentes.some(a => a.texte.includes(`« ${c.nom} »`) && Date.now() - a.at < 10 * 60000);
    const col = !c.en_ligne ? '#ff7a45' : recent ? '#ffcf8a' : '#7ee2b8';
    svg += `${recent ? `<circle class="onde" cx="${x}" cy="${y}" r="8" fill="none" stroke="${col}" stroke-width="2"/>` : ''}
      <circle cx="${x}" cy="${y}" r="7" fill="${col}"/><text x="${x}" y="${y + (y > top ? 22 : -12)}" text-anchor="middle" font-size="${x < 120 || x > W - 120 ? 10 : 11}" fill="${col}" letter-spacing="1">${esc(c.nom.toUpperCase())}${/toit/.test(N(c.nom)) ? ' · VELUX' : ''}</text>${!c.en_ligne || recent ? `<text x="${x}" y="${y + (y > top ? 36 : -24)}" text-anchor="middle" font-size="10" fill="${col}">${!c.en_ligne ? 'HORS LIGNE' : 'MOUVEMENT'}</text>` : ''}`;
  });
  svg += `<text x="${W / 2}" y="${yBas + 40}" text-anchor="middle" font-size="11" fill="rgba(255,217,160,.35)" letter-spacing="4">— LA RUE —</text>
    <text x="${W - 18}" y="${top + Hn + gap / 2}" text-anchor="middle" font-size="10" fill="rgba(255,217,160,.3)" letter-spacing="3" transform="rotate(90 ${W - 18} ${top + Hn + gap / 2})">ARRIÈRE · COUR</text></svg>`;
  if (el._svg === svg) return; el._svg = svg; // rien n'a changé : on ne redessine pas
  el.innerHTML = svg;
  el.querySelectorAll('.piece').forEach(g => g.addEventListener('click', () => bascule(g.dataset.id)));
}

/* ---------- les lumières et les prises ---------- */
let appareils = [];
async function chargeAppareils() {
  let l; try { l = (await appel('/maison/appareils')).appareils || []; } catch (e) { return; }
  const sig = JSON.stringify(l.map(a => [a.id, a.allume, a.lum, a.watts && Math.round(a.watts)]));
  if (sig === chargeAppareils._sig && appareils.length) return; chargeAppareils._sig = sig; appareils = l;
  const lampes = appareils.filter(a => a.type === 'lampe'), prises = appareils.filter(a => a.type !== 'lampe');
  $('#lum-res').textContent = `${lampes.filter(a => a.allume).length} allumée(s) sur ${lampes.length}`;
  $('#lumieres').innerHTML = lampes.map(a => `<div class="tuile ${a.allume ? 'on' : ''} ${a.allume == null ? 'hs' : ''}" data-id="${esc(a.id)}">
      <div class="nom">${esc(a.nom)}</div><div class="val">${a.allume == null ? 'sans courant' : a.allume ? `${a.lum != null ? a.lum + ' %' : 'allumée'}` : 'éteinte'}</div>
      ${a.lum != null && a.allume ? `<input type="range" min="2" max="100" value="${a.lum}" data-lum="${esc(a.id)}">` : ''}</div>`).join('');
  $('#lumieres').innerHTML += prises.map(a => `<div class="tuile ${a.allume ? 'on' : ''} ${a.allume == null ? 'hs' : ''}" data-id="${esc(a.id)}">
      <div class="nom">${esc(a.nom)}</div><div class="val">${a.allume == null ? 'débranchée' : a.watts != null ? `${a.allume ? 'allumée' : 'éteinte'} · ${nf(a.watts, 0)} W` : a.allume ? 'allumée' : 'éteinte'}</div></div>`).join('');
  document.querySelectorAll('.tuile[data-id]').forEach(el => el.addEventListener('click', e => { if (e.target.matches('input')) return; bascule(el.dataset.id); }));
  document.querySelectorAll('input[data-lum]').forEach(el => el.addEventListener('change', () => commande([el.dataset.lum], true, +el.value)));
  majMaison(); plan();
}
async function commande(ids, allume, lum) {
  try { await appel('/maison/commande', Object.assign({ ids, allume }, lum != null ? { lum } : {}), 20000); } catch (e) { /* rien */ }
  setTimeout(chargeAppareils, 400);
}
function bascule(id) { const a = appareils.find(x => x.id === id); if (!a || a.allume == null) return; commande([id], !a.allume); }
function toutEteindre() { const l = appareils.filter(a => a.allume && a.type === 'lampe' && !/\bchambres?\b/.test(N(a.nom))); if (l.length) commande(l.map(a => a.id), false); }
async function danger() {
  if (!confirm('Protocole danger : toutes les lumières à fond, une photo de chaque caméra gardée comme preuve, et une alerte urgente sur ton téléphone. On y va ?')) return;
  const l = appareils.filter(a => a.type === 'lampe' && a.allume != null);
  await Promise.all([l.length ? appel('/maison/commande', { ids: l.map(a => a.id), allume: true, lum: 100, teinte: 50 }, 20000).catch(() => {}) : null, appel('/maison/danger', {}).catch(() => {})]);
  if (confirm('Appeler le 17 maintenant ?')) location.href = 'tel:17';
  chargeAppareils(); chargeAlertes();
}

/* ---------- le mode absent, la sentinelle ---------- */
let absent = false;
async function chargeSentinelle() { const avant = absent; try { absent = !!(await appel('/maison/sentinelle')).absent; } catch (e) { /* rien */ } majEtat(); if (avant !== absent) cartes2(); }
function cartes2() { const b = document.querySelector('.scene[data-k="1"]'); if (b) b.innerHTML = absent ? '<i>🏠</i>Je suis rentré' : '<i>🚪</i>Je pars'; }
async function basculeAbsent(b) { if (ATLAS) { dis(absent ? 'je suis rentré' : 'je pars', b); setTimeout(chargeSentinelle, 4000); return; } try { await appel('/maison/sentinelle', { absent: !absent }); } catch (e) { /* rien */ } setTimeout(chargeSentinelle, 500); }

/* ---------- les caméras ---------- */
let cams = [], urls = {};
async function chargeCams() {
  const l = [];
  try { ((await appel('/maison/ezviz')).cameras || []).forEach(c => l.push({ nom: c.nom, ezviz: true, en_ligne: c.en_ligne !== false, batterie: c.batterie })); } catch (e) { /* rien */ }
  try { ((await appel('/maison/cameras')).cameras || []).forEach(c => l.push({ nom: c.nom.charAt(0).toUpperCase() + c.nom.slice(1), cle: c.nom, en_ligne: true })); } catch (e) { /* rien */ }
  cams = l; dessineCams(); plan();
  cams.filter(c => !c.ezviz).forEach(photo); // les caméras branchées : une image toutes les 30 s ; celles sur batterie : à la demande
}
function dessineCams() {
  $('#cams').innerHTML = cams.map((c, i) => `<div class="cam ${alertesRecentes.some(a => a.texte.includes(`« ${c.nom} »`) && Date.now() - a.at < 10 * 60000) ? 'mouv' : ''}" data-i="${i}">${urls[c.nom] ? `<img src="${urls[c.nom]}" alt="">` : `<div class="vide">${c.en_ligne ? (c.ezviz ? 'sur batterie<br>toucher pour une photo' : 'chargement…') : 'SIGNAL PERDU'}</div>`}
    <span class="lab" style="color:${c.en_ligne ? 'var(--texte)' : 'var(--alerte)'}">${esc(c.nom.toUpperCase())}</span><span class="info">${c.ezviz && c.batterie != null ? `🔋 ${c.batterie} %` : ''}${c.at ? ` · ${c.at}` : ''}</span></div>`).join('');
  document.querySelectorAll('.cam').forEach(el => el.onclick = () => photo(cams[+el.dataset.i]));
}
async function photo(c) {
  if (!c || !c.en_ligne) return;
  if (c.ezviz) { const el = document.querySelector(`.cam[data-i="${cams.indexOf(c)}"] .info`); if (el) el.textContent = 'réveil…'; }
  try {
    const b = await appel(c.ezviz ? `/maison/ezviz/photo?nom=${encodeURIComponent(c.nom)}` : `/maison/camera?nom=${encodeURIComponent(c.cle)}`, null, c.ezviz ? 70000 : 20000);
    if (b instanceof Blob && b.size > 1000) { if (urls[c.nom]) URL.revokeObjectURL(urls[c.nom]); urls[c.nom] = URL.createObjectURL(b); c.at = hh(new Date()); }
  } catch (e) { /* rien */ }
  dessineCams();
}

/* ---------- les alertes ---------- */
let photosAlertes = {};
async function chargeAlertes() {
  let l = []; try { l = (await appel('/maison/alertes?depuis=0')).alertes || []; } catch (e) { return; }
  alertesRecentes = l.filter(a => a.genre === 'ezviz' || a.genre === 'camera'); plan();
  l = l.filter(a => a.gravite !== 'info').slice(-8).reverse();
  $('#al-res').textContent = l.length ? `${l.length} récentes` : '';
  $('#alertes').innerHTML = l.length ? l.map(a => `<div class="alerte ${a.gravite === 'urgent' ? 'urgent' : ''}"><span class="h">${hh(new Date(a.at))}</span>${a.image ? `<img data-al="${a.id}" alt="">` : ''}<span class="t">${esc(a.texte)}</span></div>`).join('') : '<div class="muted">Rien à signaler.</div>';
  for (const a of l.filter(x => x.image)) {
    if (!photosAlertes[a.id]) { try { const b = await appel(`/maison/alerte/image?id=${a.id}`); if (b instanceof Blob) photosAlertes[a.id] = URL.createObjectURL(b); } catch (e) { /* rien */ } }
    const img = document.querySelector(`img[data-al="${a.id}"]`); if (img && photosAlertes[a.id]) img.src = photosAlertes[a.id];
  }
}

/* ---------- l'agenda (Google, lecture seule) ---------- */
async function chargeAgenda() {
  let r; try { r = await appel('/maison/agenda?jours=2'); } catch (e) { return; }
  const el = $('#agenda'); if (!el) return;
  if (!r.relie) { el.innerHTML = '<div class="muted">Agenda pas encore relié.</div>'; return; }
  const now = Date.now() / 1000, auj = new Date().toDateString(), dem = new Date(Date.now() + 86400000).toDateString();
  const l = (r.evenements || []).filter(e => e.fin > now - 1800);
  const a = l.filter(e => new Date(e.debut * 1000).toDateString() === auj || (e.journee && e.debut < now)), d = l.filter(e => new Date(e.debut * 1000).toDateString() === dem).slice(0, 3);
  const un = e => `<div class="rdv ${e.fin < now ? 'passe' : ''}"><span class="h">${e.journee ? '—' : hh(new Date(e.debut * 1000))}</span><span>${esc(e.titre)}</span></div>`;
  $('#ag-res').textContent = a.length ? `${a.filter(e => !e.journee && e.debut > now).length} à venir` : '';
  el.innerHTML = (a.length ? a.map(un).join('') : '<div class="muted">Rien de prévu aujourd\'hui.</div>') + (d.length ? `<div class="jour" style="margin:10px 0 2px">DEMAIN</div>${d.map(un).join('')}` : '');
}

/* ---------- les marchés ---------- */
async function chargeMarche() {
  let m; try { m = await appel('/atlas/marche?h=24'); } catch (e) { return; }
  const noms = { XAU: 'OR', XAG: 'ARGENT', HG: 'CUIVRE', EURUSD: 'EUR/USD' };
  $('#marche').innerHTML = Object.entries(m.cours || {}).map(([k, c]) => `<div class="prix"><div class="s">${noms[k] || k}</div><div class="p">${nf(c.prix, k === 'EURUSD' ? 4 : 2)}</div>${c.var24 != null ? `<div class="${c.var24 >= 0 ? 'haut' : 'bas'} mono" style="font-size:12px">${c.var24 >= 0 ? '▲' : '▼'} ${nf(Math.abs(c.var24))} %</div>` : ''}</div>`).join('');
  const prochaines = (m.annonces || []).filter(a => a.impact === 'High' && Date.parse(a.date) > Date.now()).slice(0, 3);
  $('#annonces').innerHTML = prochaines.length ? 'Annonces fortes : ' + prochaines.map(a => `${esc(a.pays)} ${esc(a.titre)} (${new Date(a.date).toLocaleString('fr-FR', { weekday: 'short', hour: '2-digit', minute: '2-digit' })})`).join(' · ') : '';
}

/* ---------- la maison : Shadow, la Fusée, l'énergie, la météo ---------- */
let diag = {}, energie = null, meteo = null;
async function chargeDiag() { try { diag = await appel('/atlas/diag'); } catch (e) { /* rien */ } majMaison(); majEtat(); }
async function chargeEnergie() { try { energie = await appel('/maison/energie'); } catch (e) { /* rien */ } majMaison(); }
async function chargeMeteo() {
  const v = reglages.ville; if (!v || !v.lat) return;
  try { meteo = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${v.lat}&longitude=${v.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`)).json(); } catch (e) { /* rien */ }
  majEtat();
}
const recent = x => { if (!x || !x.recu) return false; const [h, m, s] = x.recu.split(':').map(Number), t = new Date(); t.setHours(h, m, s || 0, 0); return Date.now() - t < 3 * 60000; };
function majMaison() {
  const el = $('#maison'); if (!el) return;
  const sh = Object.entries(diag).find(([k]) => /^shadow/.test(k)), s = sh && recent(sh[1]) ? sh[1] : null;
  const fu = appareils.find(a => /\bfusee\b/.test(N(a.nom)));
  const h = new Date().getHours();
  const atlas = Object.entries(diag).filter(([k, v]) => !/^shadow/.test(k) && recent(v)).map(([k]) => k);
  const tot = energie ? Object.values(energie.aujourdhui || {}).reduce((a, b) => a + b, 0) : null;
  el.innerHTML = ligne('Shadow', s ? (s.enfantVu ? 'réveillé · il le voit' : 'réveillé') : 'endormi ou fermé', s ? 'ok' : '')
    + (fu ? ligne('La Fusée', fu.allume ? ((h >= 20 || h < 8) ? 'allumée · il dort ici' : 'allumée') : 'éteinte', fu.allume ? 'ok' : '') : '')
    + ligne('Atlas allumés', atlas.length ? atlas.join(', ') : 'aucun')
    + (tot != null ? ligne("Énergie aujourd'hui", `${nf(tot)} kWh · ${nf(tot * (energie.prix_kwh || 0.25))} €`) : '');
}
function majEtat() {
  const c = meteo && meteo.current, d = meteo && meteo.daily;
  $('#etat').innerHTML = `<span class="pastille ${absent ? 'al' : 'ok'}">Maison <b>${absent ? 'mode absent' : 'présence'}</b></span>`
    + (c ? `<span class="pastille">${esc(reglages.ville.name || '')} <b>${Math.round(c.temperature_2m)}°</b>${d ? ` · ${Math.round(d.temperature_2m_min[0])}/${Math.round(d.temperature_2m_max[0])}° · pluie ${d.precipitation_probability_max[0]} %` : ''}</span>` : '')
    + (() => { const sh = Object.entries(diag).find(([k]) => /^shadow/.test(k)), ok = sh && recent(sh[1]); return `<span class="pastille ${ok ? 'ok' : ''}">Shadow <b>${ok ? (sh[1].enfantVu ? 'avec lui' : 'réveillé') : 'endormi'}</b></span>`; })()
    + `<span class="pastille" id="p-sys">Systèmes <b>…</b></span>`;
  if (sys) majSysteme();
}

/* ---------- les systèmes ---------- */
let sys = null;
async function chargeSysteme() { try { sys = await appel('/maison/pc', { action: 'systeme' }); } catch (e) { /* rien */ } majSysteme(); }
function majSysteme() {
  if (!sys) return;
  const off = Object.entries(sys.services || {}).filter(([, v]) => !v).map(([k]) => k);
  const pb = off.length || sys.cpu_temp >= 85 || sys.disque >= 90;
  const p = $('#p-sys'); if (p) { p.className = `pastille ${pb ? 'al' : 'ok'}`; p.innerHTML = `Systèmes <b>${pb ? 'à vérifier' : 'opérationnels'}</b>`; }
  $('#systeme').innerHTML = ligne('Processeur', `${sys.cpu_temp ?? '?'} °C · charge ${nf(sys.charge, 1)}`, sys.cpu_temp >= 85 ? 'al' : 'ok') + ligne('Carte graphique', `${sys.gpu_temp ?? '?'} °C`, sys.gpu_temp >= 85 ? 'al' : 'ok')
    + ligne('Mémoire', `${sys.ram} %`, sys.ram >= 90 ? 'al' : 'ok') + ligne('Disque', `${sys.disque} % · ${sys.disque_libre_go} Go libres`, sys.disque >= 90 ? 'al' : 'ok')
    + Object.entries(sys.services || {}).map(([k, v]) => ligne(k.charAt(0).toUpperCase() + k.slice(1), v ? 'en ligne' : 'ARRÊTÉ', v ? 'ok' : 'al')).join('')
    + ligne('Réseau', `${sys.reseau.presents} appareils`) + (sys.tailscale || []).map(t => ligne(t.nom, t.en_ligne ? 'connecté' : 'hors ligne', t.en_ligne ? 'ok' : '')).join('');
}

/* ---------- le démarrage ---------- */
function horloge() { const d = new Date(); $('#heure').textContent = hh(d); $('#date').textContent = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); const h = d.getHours(); document.body.classList.toggle('nuit', h >= 22 || h < 6); }
setInterval(horloge, 1000); horloge();
async function veille() { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) { /* rien */ } } // l'écran reste allumé (tablette au mur)
document.addEventListener('visibilitychange', () => { if (!document.hidden) { veille(); tout(); } });
function tout() { chargeAppareils(); chargeSentinelle(); chargeCams(); chargeAlertes(); chargeMarche(); chargeDiag(); chargeEnergie(); chargeSysteme(); chargeMeteo(); chargeAgenda(); }
function demarre() {
  cartes(); majEtat(); tout(); veille();
  setInterval(chargeAppareils, 20000); setInterval(chargeSentinelle, 30000); setInterval(chargeAlertes, 30000); setInterval(chargeDiag, 30000);
  setInterval(() => cams.filter(c => !c.ezviz).forEach(photo), 30000); setInterval(chargeCams, 5 * 60000);
  setInterval(chargeMarche, 120000); setInterval(chargeAgenda, 5 * 60000); setInterval(chargeEnergie, 5 * 60000); setInterval(chargeSysteme, 60000); setInterval(chargeMeteo, 30 * 60000);
}
if (ROOT) demarre();
else {
  $('#config').hidden = false;
  $('#adresse-ok').onclick = () => { const v = $('#adresse').value.trim().replace(/\/+$/, '').replace(/\/v1$/, ''); if (!/^https:\/\//.test(v)) return; try { localStorage.setItem('cockpit-adresse', v); } catch (e) { /* rien */ } location.reload(); };
}
</script>
