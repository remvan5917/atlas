<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060a">
<title>Cockpit Atlas</title>
<style>
  :root { --bg: #04060a; --carte: rgba(10, 14, 20, .94); --ambre: #ffb547; --ambre2: #ffd9a0; --cyan: #5fd3ff; --texte: #eef3f8; --doux: rgba(190, 215, 235, .55);
    --ligne: rgba(95, 211, 255, .16); --ligneA: rgba(255, 181, 71, .28); --ok: #6ef0b8; --alerte: #ff6b4a; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--texte); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { padding: 10px 14px 12px; min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column;
    background: radial-gradient(55% 45% at 50% -5%, rgba(95, 211, 255, .09), transparent 70%), radial-gradient(45% 40% at 0% 100%, rgba(255, 181, 71, .05), transparent 70%), var(--bg); }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 7; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .018) 0 1px, transparent 1px 3px); }
  body.nuit::after { content: ''; position: fixed; inset: 0; background: rgba(0, 0, 0, .5); pointer-events: none; z-index: 8; }
  .mono { font-family: ui-monospace, 'DejaVu Sans Mono', 'Roboto Mono', monospace; }
  svg.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* l'en-tête */
  header { display: grid; grid-template-columns: auto 1fr; grid-template-areas: 'titre etat' 'bandeau bandeau'; align-items: center; gap: 8px 14px; margin-bottom: 8px; }
  header > div:first-child { grid-area: titre; } .etat { grid-area: etat; } .bandeau { grid-area: bandeau; }
  .marque { font: 600 11px ui-monospace, monospace; letter-spacing: .38em; color: var(--cyan); }
  .marque b { color: var(--ambre); font-weight: 600; }
  .horloge { display: flex; align-items: baseline; gap: 12px; margin-top: 2px; }
  .heure { font: 200 clamp(34px, 4vw, 50px)/1 ui-monospace, monospace; letter-spacing: .02em; color: #fff; text-shadow: 0 0 18px rgba(95, 211, 255, .35); }
  .heure small { font-size: .42em; color: var(--cyan); margin-left: 2px; }
  .date { font: 12px ui-monospace, monospace; letter-spacing: .2em; color: var(--doux); text-transform: uppercase; }
  .bandeau { border: 1px solid var(--ligne); border-radius: 4px; padding: 5px 12px; font: 12px ui-monospace, monospace; letter-spacing: .14em; color: var(--cyan); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(95, 211, 255, .04); }
  .bandeau span { transition: opacity .5s; }
  .bandeau::before { content: '▸ '; color: var(--ambre); }
  .etat { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .puce { display: flex; align-items: center; gap: 7px; border: 1px solid var(--ligne); border-radius: 8px; padding: 6px 9px; font: 10.5px ui-monospace, monospace; letter-spacing: .08em; color: var(--doux); text-transform: uppercase; white-space: nowrap; }
  .puce b { color: var(--texte); font-weight: 600; }
  .puce.reglages { cursor: pointer; background: none; padding: 5px 7px; color: var(--doux); } .puce.reglages svg.ic { width: 16px; height: 16px; } .puce.reglages:active { color: var(--cyan); border-color: var(--cyan); }
  .led { width: 7px; height: 7px; border-radius: 50%; background: var(--doux); flex: 0 0 auto; }
  .led.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); } .led.al { background: var(--alerte); box-shadow: 0 0 8px var(--alerte); animation: clig 1.2s steps(2) infinite; } .led.am { background: var(--ambre); box-shadow: 0 0 8px var(--ambre); }
  @keyframes clig { 50% { opacity: .25; } }

  /* la grille : trois colonnes, sans défilement (tablette en paysage) ; la hauteur VISIBLE (dvh : sans la barre de Chrome) */
  body { height: 100vh; height: 100dvh; min-height: 0; } header { flex: 0 0 auto; }
  main { display: grid; gap: 10px; grid-template-columns: minmax(250px, 285px) minmax(0, 1fr) minmax(280px, 335px); flex: 1 1 auto; min-height: 0; }
  .col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .carte { position: relative; background: var(--carte); border: 1px solid var(--ligne); border-radius: 6px; padding: 12px 13px 13px; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .carte::before, .carte::after { content: ''; position: absolute; width: 12px; height: 12px; border-color: var(--cyan); border-style: solid; opacity: .8; pointer-events: none; }
  .carte::before { left: -1px; top: -1px; border-width: 2px 0 0 2px; border-top-left-radius: 6px; }
  .carte::after { right: -1px; bottom: -1px; border-width: 0 2px 2px 0; border-bottom-right-radius: 6px; }
  .carte.grand { flex: 1; }
  .carte h2 { margin: 0 0 10px; font: 600 10.5px ui-monospace, monospace; letter-spacing: .32em; color: var(--cyan); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex: 0 0 auto; }
  .carte h2 i { font-style: normal; color: var(--ambre); margin-right: 8px; }
  .carte h2 span { color: var(--doux); letter-spacing: .12em; font-weight: 400; font-size: 10px; }
  .defile { overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: rgba(95, 211, 255, .35) transparent; }
  .defile::-webkit-scrollbar { width: 3px; } .defile::-webkit-scrollbar-thumb { background: rgba(95, 211, 255, .35); border-radius: 2px; } /* une fine barre : il y a la suite plus bas */

  /* les scènes */
  .scenes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .scene { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 60px; padding: 8px 4px; border-radius: 4px; border: 1px solid var(--ligne); background: linear-gradient(180deg, rgba(95, 211, 255, .07), rgba(95, 211, 255, .02)); color: var(--cyan); cursor: pointer; transition: background .15s, transform .1s; }
  .scene span { font: 600 9.5px ui-monospace, monospace; letter-spacing: .14em; color: var(--texte); text-transform: uppercase; text-align: center; line-height: 1.25; }
  .scene:active { transform: scale(.96); background: rgba(95, 211, 255, .2); }
  .scene.danger { border-color: rgba(255, 107, 74, .6); color: var(--alerte); background: linear-gradient(180deg, rgba(255, 107, 74, .14), rgba(255, 107, 74, .04)); }
  .scene.fait { background: rgba(110, 240, 184, .2); border-color: var(--ok); color: var(--ok); }

  /* l'agenda : une ligne de temps */
  .rdv { position: relative; display: grid; grid-template-columns: 46px 1fr; gap: 8px; padding: 6px 0; font-size: 13.5px; }
  .rdv .h { font: 600 12.5px ui-monospace, monospace; color: var(--ambre2); }
  .rdv .t { border-left: 1px solid var(--ligneA); padding-left: 10px; position: relative; }
  .rdv .t::before { content: ''; position: absolute; left: -4px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--bg); border: 1px solid var(--ambre); }
  .rdv.prochain .t::before { background: var(--ambre); box-shadow: 0 0 8px var(--ambre); }
  .rdv.passe { opacity: .35; }
  .jour { font: 10px ui-monospace, monospace; letter-spacing: .3em; color: var(--doux); margin: 10px 0 2px; }

  /* les marchés */
  .marche { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .prix { border: 1px solid var(--ligne); border-radius: 4px; padding: 7px 9px 5px; }
  .prix .s { display: flex; justify-content: space-between; font: 10px ui-monospace, monospace; color: var(--doux); letter-spacing: .14em; }
  .prix .p { font: 500 16px ui-monospace, monospace; margin-top: 2px; }
  .prix svg { width: 100%; height: 22px; display: block; margin-top: 3px; }
  .haut { color: var(--ok); } .bas { color: var(--alerte); }

  /* le plan */
  #plan { flex: 1; min-height: 0; display: flex; } #plan svg { width: 100%; height: 100%; display: block; }
  #plan .piece { cursor: pointer; }
  #plan text { font-family: ui-monospace, monospace; pointer-events: none; }
  @keyframes onde { 0% { r: 7; opacity: .9; } 100% { r: 26; opacity: 0; } }
  #plan .onde { animation: onde 1.6s ease-out infinite; }
  @keyframes tourne { to { transform: rotate(360deg); } }
  #plan .radar { transform-box: fill-box; transform-origin: center; animation: tourne 7s linear infinite; }

  /* les lumières */
  .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 7px; }
  .carte.lum { flex: 0 1 auto; max-height: 44%; }
  .tuile { position: relative; border: 1px solid var(--ligne); border-radius: 4px; padding: 8px 10px; background: rgba(255, 255, 255, .015); cursor: pointer; user-select: none; min-height: 56px; display: flex; flex-direction: column; justify-content: space-between; transition: background .25s, border-color .25s; }
  .tuile .nom { font-size: 13px; line-height: 1.2; }
  .tuile .val { font: 10.5px ui-monospace, monospace; letter-spacing: .1em; color: var(--doux); text-transform: uppercase; }
  .tuile.on { background: linear-gradient(180deg, rgba(255, 181, 71, .2), rgba(255, 181, 71, .07)); border-color: rgba(255, 181, 71, .7); }
  .tuile.on .val { color: var(--ambre2); }
  .tuile.on::after { content: ''; position: absolute; right: 8px; top: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--ambre); box-shadow: 0 0 8px var(--ambre); }
  .tuile.hs { opacity: .35; }
  .tuile input[type=range] { width: 100%; accent-color: var(--ambre); margin: 6px 0 0; height: 20px; }

  /* les caméras */
  .cams { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; flex: 0 0 auto; }
  .cam { position: relative; border: 1px solid var(--ligne); border-radius: 4px; overflow: hidden; background: #010203; aspect-ratio: 16 / 10; cursor: pointer; }
  .cam img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(.85) contrast(1.05); }
  .cam .lab { position: absolute; left: 7px; top: 6px; font: 9.5px ui-monospace, monospace; letter-spacing: .16em; color: var(--texte); text-shadow: 0 0 4px #000; }
  .cam .info { position: absolute; right: 7px; bottom: 6px; font: 9.5px ui-monospace, monospace; letter-spacing: .1em; color: var(--doux); text-shadow: 0 0 4px #000; }
  .cam .vide { position: absolute; inset: 0; display: grid; place-items: center; font: 10px ui-monospace, monospace; letter-spacing: .14em; color: var(--doux); text-align: center; padding: 6px; background: repeating-linear-gradient(45deg, rgba(95, 211, 255, .03) 0 6px, transparent 6px 12px); }
  .cam .rec { position: absolute; right: 7px; top: 6px; font: 600 9.5px ui-monospace, monospace; color: var(--alerte); letter-spacing: .14em; animation: clig 1s steps(2) infinite; }
  .cam.mouv { border-color: var(--alerte); }
  .cam .surv { position: absolute; right: 7px; top: 6px; font: 600 9.5px ui-monospace, monospace; color: #ff8a70; letter-spacing: .14em; text-shadow: 0 0 6px rgba(255, 107, 74, .6); }
  .cam .repos { position: absolute; right: 7px; top: 6px; font: 9.5px ui-monospace, monospace; color: var(--doux); letter-spacing: .14em; }
  .cam.hs .lab { color: var(--alerte); }

  /* le journal d'alertes */
  .log { font: 12px/1.45 ui-monospace, monospace; }
  .entree { display: grid; grid-template-columns: auto 1fr; gap: 8px; padding: 6px 0 6px 8px; border-left: 2px solid var(--ligne); margin-bottom: 4px; }
  .entree .h { color: var(--doux); }
  .entree .g { color: var(--cyan); letter-spacing: .1em; }
  .entree .t { grid-column: 1 / -1; color: var(--texte); font-family: system-ui, sans-serif; font-size: 12.5px; }
  .entree.urgent { border-left-color: var(--alerte); background: rgba(255, 107, 74, .06); } .entree.urgent .g { color: var(--alerte); }
  .entree.attention { border-left-color: var(--ambre); }
  .entree img { width: 100%; max-height: 90px; object-fit: cover; border-radius: 3px; grid-column: 1 / -1; opacity: .9; }
  .muted { color: var(--doux); font: 11px ui-monospace, monospace; letter-spacing: .1em; }
  .reserve { height: 150px; flex: 0 0 auto; } /* le coin d'Atlas (son visage, en bas à droite) */

  /* le poste de travail (l'ordinateur) : la session de trading, la boîte noire */
  .travail .prix svg { height: 46px; } .travail .prix .p { font-size: 20px; }
  .sess { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .kpi { border: 1px solid var(--ligne); border-radius: 4px; padding: 8px 10px; }
  .kpi .k { font: 10px ui-monospace, monospace; letter-spacing: .16em; color: var(--doux); }
  .kpi .v { font: 500 20px ui-monospace, monospace; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jauge { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .06); margin-top: 7px; overflow: hidden; } .jauge i { display: block; height: 100%; background: var(--ok); }
  .trades { width: 100%; border-collapse: collapse; font: 12px ui-monospace, monospace; }
  .trades th { text-align: left; font-weight: 400; color: var(--doux); letter-spacing: .14em; font-size: 10px; padding: 4px 6px; border-bottom: 1px solid var(--ligne); }
  .trades td { padding: 6px; border-bottom: 1px solid rgba(95, 211, 255, .06); } .trades tr.ouvert td { color: var(--ambre2); }

  /* le démarrage */
  #boot { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; place-items: center; transition: opacity .6s; }
  #boot div { font: 12px/2 ui-monospace, monospace; letter-spacing: .25em; color: var(--cyan); min-width: 340px; }
  #boot p { margin: 0; opacity: 0; transition: opacity .3s; } #boot p.v { opacity: 1; } #boot b { color: var(--ok); font-weight: 400; float: right; }
  .toast { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 9; padding: 9px 16px; border-radius: 6px; background: rgba(4, 6, 10, .96); border: 1px solid var(--cyan); color: var(--cyan); font: 12px ui-monospace, monospace; letter-spacing: .14em; opacity: 0; transition: opacity .3s; pointer-events: none; text-transform: uppercase; }
  .config { max-width: 520px; margin: 40px auto; }
  .config input { width: 100%; font: inherit; padding: 12px; border-radius: 6px; border: 1px solid var(--ligne); background: var(--carte); color: var(--texte); margin: 8px 0; }
  .config button { font: inherit; color: var(--texte); background: rgba(95, 211, 255, .1); border: 1px solid var(--ligne); border-radius: 6px; padding: 10px 14px; }
  /* une tablette en paysage un peu étroite : les colonnes des côtés se resserrent */
  @media (orientation: landscape) and (max-width: 1150px) {
    main { grid-template-columns: minmax(205px, 245px) minmax(0, 1fr) minmax(225px, 285px); }
    .puce { padding: 5px 7px; font-size: 9.5px; }
  }
  /* la tablette en portrait : deux colonnes, tout sur un seul écran (rien qui disparaît en bas) */
  @media (orientation: portrait) and (min-width: 700px) {
    body:not(.travail) main { grid-template-columns: 1fr 1fr; grid-template-rows: auto minmax(0, 1.3fr) auto minmax(0, 1fr) auto;
      grid-template-areas: 'scenes scenes' 'plan plan' 'cams log' 'lum log' 'agenda marche'; }
    body:not(.travail) .col { display: contents; } body:not(.travail) .reserve { display: none; }
    .z-scenes { grid-area: scenes; } .z-agenda { grid-area: agenda; } .z-marche { grid-area: marche; } .z-plan { grid-area: plan; } .z-lum { grid-area: lum; } .z-cams { grid-area: cams; } .z-log { grid-area: log; }
    body:not(.travail) .scenes { grid-template-columns: repeat(6, 1fr); } #agenda { max-height: 190px; } body:not(.travail) .carte.lum { max-height: none; }
  }
  /* un téléphone, ou une tablette en paysage très étroite : une seule colonne qui défile */
  @media (max-width: 699px), (orientation: landscape) and (max-width: 860px) {
    body { height: auto; }
    header { grid-template-columns: 1fr; grid-template-areas: 'titre' 'etat' 'bandeau'; } .etat { justify-content: flex-start; }
    main, body:not(.travail) main { grid-template-columns: 1fr; grid-template-rows: none; grid-template-areas: none; height: auto; }
    .col, body:not(.travail) .col { display: flex; } .z-scenes, .z-agenda, .z-marche, .z-plan, .z-lum, .z-cams, .z-log { grid-area: auto; }
    .carte.grand, .carte.lum { flex: 0 0 auto; max-height: none; } #plan { min-height: 300px; } .defile { overflow: visible; } .reserve { height: 140px; }
  }
</style>
</head>
<body>
<div id="boot"><div id="boot-l"></div></div>
<header>
  <div>
    <div class="marque" id="marque">ATLAS <b>//</b> COCKPIT DE LA MAISON</div>
    <div class="horloge"><div class="heure" id="heure">--:--</div><div class="date" id="date"></div></div>
  </div>
  <div class="bandeau"><span id="bandeau">SYSTÈMES EN LIGNE</span></div>
  <div class="etat" id="etat"></div>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<div id="config" class="config" hidden>
  <div class="marque">ADRESSE DE LA MAISON</div>
  <p class="muted">Ouvre d'abord Atlas sur cet appareil (le cockpit reprend son adresse), ou tape l'adresse de l'ordinateur de la maison :</p>
  <input id="adresse" placeholder="https://….ts.net" autocomplete="off">
  <button id="adresse-ok">Enregistrer</button>
</div>
<script>
'use strict';
/* Le cockpit de la maison, façon salle de contrôle : scènes, agenda, marchés, plan (avec le radar), lumières et prises,
   caméras, journal des alertes — en direct. Il reprend l'adresse de la maison des réglages d'Atlas (même appareil) ;
   tout passe par l'ordinateur de la maison (Tailscale). Pensé pour une tablette au mur : léger, sans émoji. */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const N = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const propre = t => String(t || '').replace(/[\p{Extended_Pictographic}️‍]/gu, '').replace(/\s+/g, ' ').trim(); // sans émoji
let S = {}; try { S = JSON.parse(localStorage.getItem('atlas-etat') || '{}'); } catch (e) { S = {}; }
const reglages = S.settings || {};
let ROOT = ''; try { ROOT = localStorage.getItem('cockpit-adresse') || ''; } catch (e) { /* rien */ }
if (!ROOT) ROOT = (reglages.localUrl || '').replace(/\/+$/, '').replace(/\/v1$/, '');
if (!/^https?:\/\//.test(ROOT) || /localhost:11434/.test(ROOT)) ROOT = '';
// la liaison avec l'ordinateur de la maison : si elle tombe (souvent Tailscale coupé sur la tablette), on le dit en grand
const liaison = { ok: Date.now(), ko: 0, perdue: false };
function liaisonMaj() {
  const perdue = liaison.ko > 0 && Date.now() - liaison.ok > 45000;
  if (perdue === liaison.perdue) return;
  liaison.perdue = perdue;
  let el = document.getElementById('liaison');
  if (perdue && !el) {
    el = document.createElement('div'); el.id = 'liaison';
    el.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:15;max-width:560px;width:calc(100% - 32px);padding:22px 24px;border-radius:8px;background:rgba(30,6,4,.96);border:1px solid var(--alerte);box-shadow:0 0 40px rgba(255,107,74,.35);text-align:center;font:13px/1.6 ui-monospace,monospace;letter-spacing:.06em;color:var(--texte)';
    el.innerHTML = '<div style="font-weight:600;letter-spacing:.3em;color:var(--alerte);margin-bottom:10px">LIAISON PERDUE AVEC LA MAISON</div>Cet écran ne joint plus l\'ordinateur de la maison : les lumières, les caméras et l\'agenda ne peuvent pas s\'afficher.<br><br>Sur cet appareil, ouvre l\'appli <b>Tailscale</b> et touche « Connecter ». Tout revient tout seul dès que la liaison est rétablie.<div class="muted" id="liaison-t" style="margin-top:10px"></div>';
    document.body.appendChild(el);
  }
  if (!perdue && el) { el.remove(); tout(); } // la liaison est revenue : on recharge tout
}
setInterval(() => { liaisonMaj(); const t = document.getElementById('liaison-t'); if (t) t.textContent = `DERNIER CONTACT : ${hh(new Date(liaison.ok))}`; }, 5000);
async function appel(chemin, corps, ms = 15000) {
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), ms);
  try {
    let r;
    try { r = await fetch(ROOT + chemin, { method: corps ? 'POST' : 'GET', headers: corps ? { 'Content-Type': 'application/json' } : {}, body: corps ? JSON.stringify(corps) : undefined, cache: 'no-store', signal: ctl.signal }); }
    catch (e) { liaison.ko++; liaisonMaj(); throw e; }
    liaison.ok = Date.now(); liaison.ko = 0; liaisonMaj();
    if (!r.ok) throw new Error(r.status);
    return /image/.test(r.headers.get('Content-Type') || '') ? r.blob() : r.json();
  } finally { clearTimeout(tm); }
}
const hh = d => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
const nf = (v, d = 2) => Number(v).toLocaleString('fr-FR', { maximumFractionDigits: d, minimumFractionDigits: d });

/* ---------- les icônes (des traits, pas d'émoji) ---------- */
const IC = {
  power: '<path d="M12 3v8"/><path d="M6.3 6.6a8 8 0 1 0 11.4 0"/>',
  reglages: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>',
  porte: '<path d="M6 21V3h11v18"/><path d="M14 12h.01"/><path d="M3 21h18"/>',

  if (!confirm('Protocole danger : toutes les lumières à fond, une photo de chaque caméra gardée comme preuve, et une alerte urgente sur ton téléphone. On y va ?')) return;
  const l = appareils.filter(a => a.type === 'lampe' && a.allume != null);
  await Promise.all([l.length ? appel('/maison/commande', { ids: l.map(a => a.id), allume: true, lum: 100, teinte: 50 }, 20000).catch(() => {}) : null, appel('/maison/danger', {}).catch(() => {})]);
  if (confirm('Appeler le 17 maintenant ?')) location.href = 'tel:17';
  chargeAppareils(); chargeAlertes();
}

/* ---------- le mode absent ---------- */
let absent = false;
let surveillancePlateau = false; // les caméras branchées (la LSC) : surveillées par la sentinelle la nuit et en mode absent
async function chargeSentinelle() {
  const avant = absent; try { const r = await appel('/maison/sentinelle'); absent = !!r.absent; surveillancePlateau = !!r.surveillance; } catch (e) { /* rien */ }
  if (cams.length) { dessineCams(); plan(); }
  majEtat();
  if (avant !== absent && sc[1] && POSTE !== 'travail') { sc[1][0] = absent ? 'maison' : 'porte'; sc[1][1] = absent ? 'Je suis rentré' : 'Je pars'; const b = document.querySelector('.scene[data-k="1"]'); if (b) b.innerHTML = `${ic(sc[1][0])}<span>${sc[1][1]}</span>`; }
}
async function basculeAbsent(b) { if (ATLAS) { dis(absent ? 'je suis rentré' : 'je pars', b); setTimeout(chargeSentinelle, 4000); return; } try { await appel('/maison/sentinelle', { absent: !absent }); } catch (e) { /* rien */ } setTimeout(chargeSentinelle, 500); }

/* ---------- les caméras ---------- */
let cams = [], urls = {};
async function chargeCams() {
  const l = [];
  try { ((await appel('/maison/ezviz')).cameras || []).forEach(c => l.push({ nom: c.nom, ezviz: true, en_ligne: c.en_ligne !== false, batterie: c.batterie, arme: c.detection !== false })); } catch (e) { /* rien */ }
  try { ((await appel('/maison/cameras')).cameras || []).forEach(c => l.push({ nom: c.nom.charAt(0).toUpperCase() + c.nom.slice(1), cle: c.nom, en_ligne: true })); } catch (e) { /* rien */ }
  cams = l; dessineCams(); plan(); bandeauMaj();
  cams.filter(c => !c.ezviz).forEach(photo); // les caméras branchées : une image toutes les 30 s ; celles sur batterie : à la demande
}
const arme = c => c.en_ligne && (c.ezviz ? c.arme : surveillancePlateau); // armée selon les programmes (la nuit, le mode absent, la Façade de 19 h 30 à 7 h 30)
function dessineCams() {
  $('#cams').innerHTML = cams.map((c, i) => `<div class="cam ${vuRecemment(c) ? 'mouv' : ''} ${c.en_ligne ? '' : 'hs'}" data-i="${i}">${urls[c.nom] ? `<img src="${urls[c.nom]}" alt="">` : `<div class="vide">${c.en_ligne ? (c.ezviz ? 'EN VEILLE<br>TOUCHER POUR UNE IMAGE' : 'LIAISON…') : 'SIGNAL PERDU'}</div>`}
    <span class="lab">CAM ${String(i + 1).padStart(2, '0')} · ${esc(c.nom.toUpperCase())}</span>${vuRecemment(c) ? '<span class="rec">● DÉTECTION</span>' : arme(c) ? '<span class="surv">● SURVEILLANCE</span>' : '<span class="repos">○ REPOS</span>'}<span class="info">${c.ezviz && c.batterie != null ? `BAT ${c.batterie} %` : ''}${c.at ? ` · ${c.at}` : ''}</span></div>`).join('');
  document.querySelectorAll('.cam').forEach(el => el.onclick = () => photo(cams[+el.dataset.i]));
}
async function photo(c) {
  if (!c || !c.en_ligne) return;
  if (c.ezviz) { const el = document.querySelector(`.cam[data-i="${cams.indexOf(c)}"] .info`); if (el) el.textContent = 'RÉVEIL…'; }
  try {
    const b = await appel(c.ezviz ? `/maison/ezviz/photo?nom=${encodeURIComponent(c.nom)}` : `/maison/camera?nom=${encodeURIComponent(c.cle)}`, null, c.ezviz ? 70000 : 20000);
    if (b instanceof Blob && b.size > 1000) { if (urls[c.nom]) URL.revokeObjectURL(urls[c.nom]); urls[c.nom] = URL.createObjectURL(b); c.at = hh(new Date()); }
  } catch (e) { /* rien */ }
  dessineCams();
}

/* ---------- le journal des alertes ---------- */
const GENRES = { reseau: 'RÉSEAU', tailscale: 'TAILSCALE', camera: 'CAMÉRA', ezviz: 'CAMÉRA', agenda: 'AGENDA', presence: 'PRÉSENCE', marche: 'MARCHÉS', lien: 'LIEN', accueil: 'ACCUEIL', defense: 'DÉFENSE', ordinateur: 'SYSTÈME', fantome: 'FANTÔME', hologramme: 'HOLOGRAMME', reveil: 'RÉVEIL', veille: 'VEILLE', 'boite-noire': 'TRADING' };
let photosAlertes = {}, nbAlertes = 0;
async function chargeAlertes() {
  let l = []; try { l = (await appel('/maison/alertes?depuis=0')).alertes || []; } catch (e) { return; }
  alertesRecentes = l.filter(a => a.genre === 'ezviz' || a.genre === 'camera'); plan();
  l = l.filter(a => a.gravite !== 'info').slice(-10).reverse();
  nbAlertes = l.filter(a => a.gravite === 'urgent' && Date.now() - a.at < 12 * 3600000).length;
  $('#al-res').textContent = l.length ? `${l.length} ENTRÉES` : '';
  $('#alertes').innerHTML = l.length ? l.map(a => `<div class="entree ${a.gravite}"><span class="h">[${hh(new Date(a.at))}]</span><span class="g">${GENRES[a.genre] || String(a.genre || '').toUpperCase()}</span>${a.image ? `<img data-al="${a.id}" alt="">` : ''}<span class="t">${esc(propre(a.texte))}</span></div>`).join('') : '<div class="muted">AUCUN ÉVÉNEMENT. PÉRIMÈTRE CALME.</div>';
  for (const a of l.filter(x => x.image).slice(0, 3)) {
    if (!photosAlertes[a.id]) { try { const b = await appel(`/maison/alerte/image?id=${a.id}`); if (b instanceof Blob) photosAlertes[a.id] = URL.createObjectURL(b); } catch (e) { /* rien */ } }
    const img = document.querySelector(`img[data-al="${a.id}"]`); if (img && photosAlertes[a.id]) img.src = photosAlertes[a.id];
  }
  dessineCams(); majEtat(); bandeauMaj();
}

/* ---------- l'agenda (Google, lecture seule) : une ligne de temps ---------- */
let rdvProchain = null;
async function chargeAgenda() {
  let r; try { r = await appel('/maison/agenda?jours=2'); } catch (e) { return; }
  const el = $('#agenda'); if (!el) return;
  if (!r.relie) { el.innerHTML = '<div class="muted">AGENDA NON RELIÉ.</div>'; return; }
  const now = Date.now() / 1000, auj = new Date().toDateString(), dem = new Date(Date.now() + 86400000).toDateString();
  const l = (r.evenements || []).filter(e => e.fin > now - 1800);
  const a = l.filter(e => new Date(e.debut * 1000).toDateString() === auj || (e.journee && e.debut < now)), d = l.filter(e => new Date(e.debut * 1000).toDateString() === dem).slice(0, 3);
  rdvProchain = a.find(e => !e.journee && e.debut > now) || null;
  const un = e => `<div class="rdv ${e.fin < now ? 'passe' : ''} ${e === rdvProchain ? 'prochain' : ''}"><span class="h">${e.journee ? 'JOUR' : hh(new Date(e.debut * 1000))}</span><span class="t">${esc(propre(e.titre))}</span></div>`;
  $('#ag-res').textContent = a.length ? `${a.filter(e => !e.journee && e.debut > now).length} À VENIR` : '';
  el.innerHTML = (a.length ? a.map(un).join('') : '<div class="muted">RIEN DE PRÉVU AUJOURD\'HUI.</div>') + (d.length ? `<div class="jour">DEMAIN</div>${d.map(un).join('')}` : '');
  bandeauMaj();
}

/* ---------- les marchés : le cours et sa courbe sur 24 h ---------- */
const COURS = [['XAU', 'OR', 1], ['XAG', 'ARGENT', 2], ['HG', 'CUIVRE', 3], ['EURUSD', 'EUR/USD', 4]];
async function chargeMarche() {
  const res = await Promise.all(COURS.map(([k]) => appel(`/atlas/marche?serie=${k}&h=24`).catch(() => null)));
  $('#marche').innerHTML = COURS.map(([k, nom, dec], i) => {
    const m = res[i], c = m && m.cours && m.cours[k]; if (!c) return '';
    const pts = ((m.serie || []).map(x => x[1])).filter(v => v != null), lo = Math.min(...pts), hi = Math.max(...pts);
    const ligne = pts.length > 3 ? pts.map((v, j) => `${(j / (pts.length - 1) * 100).toFixed(1)},${(20 - (v - lo) / ((hi - lo) || 1) * 18).toFixed(1)}`).join(' ') : '';
    const sens = c.var24 == null ? '' : c.var24 >= 0 ? 'haut' : 'bas';
    return `<div class="prix"><div class="s"><span>${nom}</span><span class="${sens}">${c.var24 != null ? `${c.var24 >= 0 ? '+' : '−'}${nf(Math.abs(c.var24))} %` : ''}</span></div><div class="p">${nf(c.prix, dec)}</div>${ligne ? `<svg viewBox="0 0 100 22" preserveAspectRatio="none"><polyline points="${ligne}" fill="none" stroke="${sens === 'bas' ? '#ff6b4a' : '#6ef0b8'}" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg>` : ''}</div>`;
  }).join('');
}

/* ---------- Shadow, l'énergie, la météo, les systèmes ---------- */
let diag = {}, energie = null, meteo = null, sys = null;
async function chargeDiag() { try { diag = await appel('/atlas/diag'); } catch (e) { /* rien */ } majEtat(); }
async function chargeEnergie() { try { energie = await appel('/maison/energie'); } catch (e) { /* rien */ } bandeauMaj(); }
async function chargeMeteo() {
  const v = reglages.ville; if (!v || !v.lat) return;
  try { meteo = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${v.lat}&longitude=${v.lon}&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`)).json(); } catch (e) { /* rien */ }
  majEtat(); bandeauMaj();
}
async function chargeSysteme() { try { sys = await appel('/maison/pc', { action: 'systeme' }); } catch (e) { /* rien */ } majEtat(); bandeauMaj(); }
const recent = x => { if (!x || !x.recu) return false; const [h, m, s] = x.recu.split(':').map(Number), t = new Date(); t.setHours(h, m, s || 0, 0); return Date.now() - t < 3 * 60000; };
function sysPb() { if (!sys) return null; const off = Object.entries(sys.services || {}).filter(([, v]) => !v).map(([k]) => k); return off.length || sys.cpu_temp >= 92 || sys.disque >= 90 ? (off.length ? `${off.join(', ')} arrêté` : 'surchauffe ou disque plein') : ''; }
function majEtat() {
  const sh = Object.entries(diag).find(([k]) => /^shadow/.test(k)), shOk = sh && recent(sh[1]), pb = sysPb();
  $('#etat').innerHTML = `<span class="puce"><span class="led ${absent ? 'am' : 'ok'}"></span>MAISON <b>${absent ? 'ABSENT' : 'OCCUPÉE'}</b></span>`
    + `<span class="puce"><span class="led ${nbAlertes ? 'al' : 'ok'}"></span>PÉRIMÈTRE <b>${nbAlertes ? `${nbAlertes} ALERTE${nbAlertes > 1 ? 'S' : ''}` : 'CALME'}</b></span>`
    + `<span class="puce"><span class="led ${shOk ? 'ok' : ''}"></span>SHADOW <b>${shOk ? (sh[1].enfantVu ? 'AVEC LUI' : 'EN LIGNE') : 'EN VEILLE'}</b></span>`
    + `<span class="puce"><span class="led ${pb == null ? '' : pb ? 'al' : 'ok'}"></span>SYSTÈMES <b>${pb == null ? '…' : pb ? 'À VÉRIFIER' : 'NOMINAUX'}</b></span>`
    + (REGLAGES ? '<button class="puce reglages" id="btn-r" title="Réglages" aria-label="Réglages">' + ic('reglages') + '</button>' : '');
  const br = $('#btn-r'); if (br) br.onclick = () => { try { REGLAGES(); } catch (e) { /* rien */ } };
}
// la ligne d'état qui défile : une information à la fois
let bandeauL = [], bandeauI = 0;
function bandeauMaj() {
  const l = [];
  const lampes = appareils.filter(a => a.type === 'lampe');
  l.push(nbAlertes ? `${nbAlertes} alerte${nbAlertes > 1 ? 's' : ''} urgente${nbAlertes > 1 ? 's' : ''} en 12 heures` : 'Périmètre sécurisé, aucune alerte urgente');
  if (cams.length) l.push(`${cams.filter(c => c.en_ligne).length} caméras sur ${cams.length} en surveillance`);
  if (lampes.length) l.push(`${lampes.filter(a => a.allume).length} lumières actives sur ${lampes.length}`);
  if (rdvProchain) l.push(`Prochain rendez-vous : ${propre(rdvProchain.titre)} à ${hh(new Date(rdvProchain.debut * 1000))}`);
  const c = meteo && meteo.current; if (c) l.push(`Extérieur : ${Math.round(c.temperature_2m)} degrés`);
  const d = meteo && meteo.daily; if (d) l.push(`Météo : ${Math.round(d.temperature_2m_min[0])} à ${Math.round(d.temperature_2m_max[0])} degrés, pluie ${d.precipitation_probability_max[0]} %`);
  if (energie) { const tot = Object.values(energie.aujourdhui || {}).reduce((a, b) => a + b, 0); l.push(`Énergie aujourd'hui : ${nf(tot)} kWh, ${nf(tot * (energie.prix_kwh || 0.25))} €`); }
  if (sys) l.push(`Ordinateur de la maison : ${sys.cpu_temp ?? '?'} °C, mémoire ${sys.ram} %, ${sys.reseau ? sys.reseau.presents : '?'} appareils sur le réseau`);
  l.push(absent ? 'Mode absent : protocole fantôme prêt pour la soirée' : 'Atlas à l\'écoute');
  bandeauL = l;
}
setInterval(() => { if (!bandeauL.length) return; const el = $('#bandeau'); el.style.opacity = '0'; setTimeout(() => { bandeauI = (bandeauI + 1) % bandeauL.length; el.textContent = bandeauL[bandeauI].toUpperCase(); el.style.opacity = '1'; }, 500); }, 6000);

/* ---------- l'heure, la nuit, le démarrage ---------- */
function horloge() {
  const d = new Date();
  $('#heure').innerHTML = `${hh(d)}<small>:${String(d.getSeconds()).padStart(2, '0')}</small>`;
  $('#date').textContent = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  const h = d.getHours(); document.body.classList.toggle('nuit', h >= 22 || h < 6);
}
setInterval(horloge, 1000); horloge();
function boot() {
  const lignes = POSTE === 'travail' ? ['LIAISON AVEC LA MAISON', 'MARCHÉS', 'SESSION DE TRADING', 'BOÎTE NOIRE', 'AGENDA', 'CAMÉRAS', 'POSTE DE TRAVAIL EN LIGNE'] : ['LIAISON AVEC LA MAISON', 'ÉCLAIRAGE', 'CAMÉRAS', 'SENTINELLE', 'AGENDA', 'MARCHÉS', 'COCKPIT EN LIGNE'];
  const el = $('#boot-l');
  el.innerHTML = lignes.map(t => `<p>${t}<b>OK</b></p>`).join('');
  el.querySelectorAll('p').forEach((p, i) => setTimeout(() => p.classList.add('v'), 180 + i * 230));
  setTimeout(() => { const b = $('#boot'); if (!b) return; b.style.opacity = '0'; setTimeout(() => b.remove(), 700); }, 180 + lignes.length * 230 + 500);
}
async function veille() { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) { /* rien */ } } // l'écran reste allumé (tablette au mur)
document.addEventListener('visibilitychange', () => { if (!document.hidden) { veille(); tout(); } });
function tout() { chargeAppareils(); chargeSentinelle(); chargeCams(); chargeAlertes(); chargeMarche(); chargeDiag(); chargeEnergie(); chargeSysteme(); chargeMeteo(); chargeAgenda(); chargeTrading(); }
function demarre() {
  if (POSTE === 'travail') $('#marque').innerHTML = 'ATLAS <b>//</b> POSTE DE TRAVAIL';
  boot(); cartes(); majEtat(); tout(); veille();
  setInterval(chargeAppareils, 20000); setInterval(chargeSentinelle, 30000); setInterval(chargeAlertes, 30000); setInterval(chargeDiag, 30000);
  setInterval(() => cams.filter(c => !c.ezviz).forEach(photo), 30000); setInterval(chargeCams, 5 * 60000);
  setInterval(chargeMarche, 120000); setInterval(chargeEnergie, 5 * 60000); setInterval(chargeSysteme, 60000); setInterval(chargeMeteo, 30 * 60000); setInterval(chargeAgenda, 5 * 60000); setInterval(chargeTrading, 30000);
}
// le jumeau holographique (jumeau.js, de la même version que le cockpit) : chargé avant le démarrage
function avecJumeau(f) { const s = document.createElement('script'); s.src = `jumeau.js?v=${encodeURIComponent(new URLSearchParams(location.search).get('v') || '')}`; s.onload = s.onerror = f; document.head.appendChild(s); }
if (ROOT) avecJumeau(demarre);
else {
  $('#boot').remove(); $('#config').hidden = false;
  $('#adresse-ok').onclick = () => { const v = $('#adresse').value.trim().replace(/\/+$/, '').replace(/\/v1$/, ''); if (!/^https:\/\//.test(v)) return; try { localStorage.setItem('cockpit-adresse', v); } catch (e) { /* rien */ } location.reload(); };
}
</script>
