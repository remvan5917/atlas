<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Atlas · caméras EZVIZ</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f1a; color: #e7e5e4; font: 16px/1.5 Inter, system-ui, sans-serif; padding: 16px; }
  main { width: min(420px, 100%); background: #121a2b; border: 1px solid #22304d; border-radius: 16px; padding: 22px 18px; }
  h1 { font-size: 20px; margin: 0 0 6px; } p { color: #c4c9d4; margin: 8px 0; font-size: 14.5px; }
  label { display: block; font-size: 13px; color: #94a3b8; margin: 14px 0 4px; }
  input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0b1222; color: #e7e5e4; font-size: 16px; }
  button { width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 12px; background: linear-gradient(135deg, #38bdf8, #2563eb); color: #fff; font: 700 16px Inter, system-ui, sans-serif; }
  .ok { color: #86efac; } .ko { color: #fca5a5; } .cache { display: none; }
</style>
</head>
<body>
<main>
  <h1>📷 Rebrancher les caméras EZVIZ</h1>
  <p>Tape l'identifiant et le mot de passe de ton appli EZVIZ. Ils vont directement à l'ordinateur de la maison (par Tailscale), servent une seule fois, et ne sont jamais gardés.</p>
  <form id="f">
    <label for="u">Identifiant EZVIZ (e-mail ou téléphone)</label><input id="u" autocomplete="username" required>
    <label for="p">Mot de passe EZVIZ</label><input id="p" type="password" autocomplete="current-password" required>
    <div id="bc" class="cache"><label for="c">Code reçu par SMS ou e-mail</label><input id="c" inputmode="numeric" autocomplete="one-time-code"></div>
    <button id="b">Rebrancher</button>
  </form>
  <div id="m"></div>
</main>
<script>
// la page de secours quand l'accès EZVIZ de la maison a expiré : la réponse va à la maison, rien n'est stocké ici
const MAISON = (new URLSearchParams(location.hash.slice(1)).get('maison') || '').replace(/\/$/, '');
const m = document.getElementById('m'), esc = t => String(t || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
if (!MAISON) m.innerHTML = '<p class="ko">Ce lien est incomplet : ouvre celui que je t\'ai donné.</p>';
document.getElementById('f').onsubmit = async ev => {
  ev.preventDefault(); const b = document.getElementById('b'); b.disabled = true; m.innerHTML = '<p>Je rebranche… (jusqu\'à une minute)</p>';
  const corps = { user: document.getElementById('u').value.trim(), mdp: document.getElementById('p').value, code: document.getElementById('c').value.trim() };
  try {
    const j = await (await fetch(MAISON + '/maison/ezviz/relie', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) })).json();
    if (j.ok) { document.getElementById('p').value = ''; document.getElementById('f').style.display = 'none'; m.innerHTML = `<p class="ok">✓ C'est rebranché${(j.cameras || []).length ? ` : ${esc(j.cameras.join(', '))}` : ''}. La maison surveille de nouveau tes caméras, et la façade s'active toute seule pour ta nuit dehors.</p>`; return; }
    if (j.code_requis) { document.getElementById('bc').classList.remove('cache'); m.innerHTML = '<p>EZVIZ t\'envoie un code (SMS ou e-mail). Tape-le ci-dessus, puis appuie de nouveau sur « Rebrancher ».</p>'; }
    else m.innerHTML = `<p class="ko">${esc(j.raison || 'refusé')}</p>`;
  } catch (e) { m.innerHTML = '<p class="ko">La maison ne répond pas (ton téléphone doit être sur Tailscale).</p>'; }
  b.disabled = false;
};
</script>
</body>
</html>
